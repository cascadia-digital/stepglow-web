<!doctype html>
<!-- The 1200×630 image shown when a link to the site is shared. Rendered by render.sh. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
    :root {
        --night: #05060F; --deep: #0B1030;
        --glow-a: #3B3F9E; --glow-b: #4A3F9E; --glow-c: #14204A;
        --accent: #A9C1FF;
    }
    * { margin: 0; box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
        position: relative; color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
        -webkit-font-smoothing: antialiased;
        background:
            radial-gradient(720px 520px at 12% 0%, var(--glow-a), transparent 70%),
            radial-gradient(620px 520px at 82% 100%, var(--glow-b), transparent 70%),
            radial-gradient(500px 400px at 100% 10%, var(--glow-c), transparent 70%),
            linear-gradient(160deg, var(--deep), var(--night));
    }
    .copy { position: absolute; left: 80px; top: 70px; width: 660px; }
    .brand { display: flex; align-items: center; gap: 18px; font-size: 32px; font-weight: 600; letter-spacing: -0.01em; }
    .brand img { width: 76px; height: 76px; border-radius: 17px; box-shadow: 0 8px 24px rgb(0 0 0 / 0.35); }
    h1 { margin-top: 46px; font-size: 80px; line-height: 1.02; font-weight: 600; letter-spacing: -0.045em; }
    .sub { margin-top: 22px; font-size: 28px; line-height: 1.35; color: rgb(255 255 255 / 0.78); max-width: 620px; }
    .cta { position: absolute; left: 80px; bottom: 66px; display: flex; align-items: center; gap: 26px; }
    .pill {
        display: inline-flex; align-items: center; gap: 12px; padding: 17px 30px; border-radius: 999px;
        background: var(--accent); color: var(--night); font-size: 25px; font-weight: 700; letter-spacing: -0.01em;
    }
    .badge { height: 66px; display: block; }
    .domain { font-size: 24px; font-weight: 600; color: rgb(255 255 255 / 0.72); }
    .phone {
        position: absolute; right: 92px; top: 52px; width: 300px; height: 652px; padding: 10px;
        border-radius: 54px; background: #0B0B10; transform: rotate(4deg);
        box-shadow: 0 0 0 2px rgb(255 255 255 / 0.18), 0 30px 80px rgb(0 0 0 / 0.55);
    }
    .phone img { width: 100%; height: 100%; border-radius: 44px; object-fit: cover; display: block; }
    [hidden] { display: none !important; }
</style>
</head>
<body>
    <div class="copy">
        <div class="brand"><img src="../public/icon.png" alt="">Stepglow</div>
        <h1>Your steps,<br>at a glance.</h1>
        <p class="sub">Today's step count on your Home Screen and Lock Screen. Big, beautiful and private.</p>
    </div>
    <div class="cta">
        <span class="pill" id="soon">Coming soon to the App Store</span>
        <img class="badge" id="live" src="app-store-badge.svg" alt="Download on the App Store" hidden>
        <span class="domain">stepglow.app</span>
    </div>
    <div class="phone"><img src="../public/media/stepglow-tour-poster.jpg" alt=""></div>
    <script>
        // ?cta=live swaps the "coming soon" pill for Apple's official badge.
        if (new URLSearchParams(location.search).get('cta') === 'live') {
            document.getElementById('soon').hidden = true;
            document.getElementById('live').hidden = false;
        }
    </script>
</body>
</html>
